services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreagents-appcard-smoke:1.0.1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    ports:
      - 127.0.0.1:4400:8080
    networks: [emdash]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  emdash:
    external: true
